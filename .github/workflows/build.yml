on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test

  # Builds the Lambda package the same way as `sam build` (Makefile) and runs it
  # in the Lambda Node.js 24 base image, so that a sqlite3 binary that does not
  # load on the Lambda OS fails here instead of in the deployed functions.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: make build-TileFunction ARTIFACTS_DIR="$RUNNER_TEMP/package"
      - name: Smoke test in the Lambda base image
        run: scripts/smoke-test-in-lambda-image.sh "$RUNNER_TEMP/package"

  deploy:
    needs: [test, package]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Do not run two deployments of the same stage at once.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache here: a cache written by a pull request run must not
      # reach the job that holds the AWS credentials.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: yarn install --frozen-lockfile
      - run: yarn build

      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: 1.169.0
          use-installer: true

      - run: sam build
      # The package deployed is built here, not in the package job, so test it too.
      # Runs before the AWS credentials are configured.
      - name: Smoke test the built functions in the Lambda base image
        run: scripts/smoke-test-in-lambda-image.sh .aws-sam/build/TileFunction .aws-sam/build/MetaFunction

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCID }}:role/${{ secrets.AWS_DEPLOYMENT_ROLE_NAME }}
          aws-region: ap-northeast-1

      # The logs of this public repository must not show the API endpoint:
      # clients reach it through CloudFront. Mask the ID of an existing stack
      # here, and drop the stack outputs from the sam deploy log below (they
      # hold the ID of a new stack, which can't be masked before it exists).
      - name: Mask the API ID
        env:
          STACK_NAME: ${{ github.ref == 'refs/heads/main' && 'tileserverless-sam-v1' || 'tileserverless-sam-dev' }}
        run: |
          api_id="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiId'].OutputValue" --output text 2>/dev/null || true)"
          if [ -n "$api_id" ] && [ "$api_id" != None ]; then
            echo "::add-mask::$api_id"
          fi

      - name: Deploy v1
        if: github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          sam deploy --config-env v1 --parameter-overrides \
            "Stage=v1" "NameSuffix=-sam" \
            "SecurityGroupIds=$SECURITY_GROUP_IDS" "SubnetIds=$SUBNET_IDS" \
            "FileSystemAccessPointId=$FILESYSTEM_ACCESS_POINT_ID" \
            "CloudFrontDomainName=$CLOUDFRONT_DOMAIN_NAME" \
            | sed '/CloudFormation outputs from deployed stack/,$d'
        env:
          SECURITY_GROUP_IDS: ${{ secrets.TILESERVERLESS_SECURITY_GROUP_ID }}
          SUBNET_IDS: ${{ secrets.TILESERVERLESS_SUBNET_ID }}
          FILESYSTEM_ACCESS_POINT_ID: ${{ secrets.TILESERVERLESS_FILESYSTEM_ACCESS_POINT_ID }}
          CLOUDFRONT_DOMAIN_NAME: ${{ secrets.CLOUDFRONT_DOMAIN_NAME_V1 }}

      - name: Deploy dev
        if: github.ref == 'refs/heads/develop'
        run: |
          set -o pipefail
          sam deploy --config-env default --parameter-overrides \
            "Stage=dev" "NameSuffix=-sam" \
            "SecurityGroupIds=$SECURITY_GROUP_IDS" "SubnetIds=$SUBNET_IDS" \
            "FileSystemAccessPointId=$FILESYSTEM_ACCESS_POINT_ID" \
            "CloudFrontDomainName=$CLOUDFRONT_DOMAIN_NAME" \
            | sed '/CloudFormation outputs from deployed stack/,$d'
        env:
          SECURITY_GROUP_IDS: ${{ secrets.TILESERVERLESS_SECURITY_GROUP_ID }}
          SUBNET_IDS: ${{ secrets.TILESERVERLESS_SUBNET_ID }}
          FILESYSTEM_ACCESS_POINT_ID: ${{ secrets.TILESERVERLESS_FILESYSTEM_ACCESS_POINT_ID }}
          CLOUDFRONT_DOMAIN_NAME: ${{ secrets.CLOUDFRONT_DOMAIN_NAME }}

      # Requests the new API directly (not through CloudFront). Set the
      # repository variable SMOKE_TEST_TILESET to a tileset on EFS to also check
      # 200 responses; without it, only the handlers' 404 for a missing tileset.
      - name: Check the deployed API
        env:
          STACK_NAME: ${{ github.ref == 'refs/heads/main' && 'tileserverless-sam-v1' || 'tileserverless-sam-dev' }}
          SMOKE_TEST_TILESET: ${{ vars.SMOKE_TEST_TILESET }}
        run: |
          api_url="$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" --output text)"
          api_id="${api_url#https://}"
          echo "::add-mask::${api_id%%.*}"
          if [ -n "$SMOKE_TEST_TILESET" ]; then
            echo "::add-mask::$SMOKE_TEST_TILESET"
          fi
          node scripts/check-deployment.js "$api_url" ${SMOKE_TEST_TILESET:+"$SMOKE_TEST_TILESET"}
