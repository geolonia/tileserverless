allowBuilds:
  sqlite3: true
  # Used by jest's watch mode; its prebuilt binary is an optional dependency.
  '@parcel/watcher': false

overrides:
  # sqlite3 5 and node-gyp 8 ask for tar 6 (vulnerable). They only use it to
  # build sqlite3 from source. sqlite3 6 can't replace sqlite3 5: its prebuilt
  # binary needs glibc 2.38, newer than the Lambda runtime's.
  tar: ^7.5.23
